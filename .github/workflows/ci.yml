# The delivery checks of T18, run from a clean checkout on every push and pull request.
#
# PostgreSQL 18 runs as a service on the same port the project uses (5433), so the code under test is
# configured by environment variables only — there is no `.env` in CI, and no reliance on a developer's
# machine. The browser job builds its own disposable `jbhifi_e2e_demo` database from `sql/*.sql` and the
# documented demo scenarios, so it never touches the `jbhifi` database the other jobs use.
name: CI

on:
  push:
  pull_request:

env:
  POSTGRES_USER: jbhifi
  POSTGRES_PASSWORD: devpassword
  POSTGRES_DB: jbhifi
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5433"
  POSTGRES_TEST_DB: jbhifi_test
  POSTGRES_APP_USER: jbhifi_app
  POSTGRES_APP_PASSWORD: apppassword
  SESSION_SECRET: ci-only-not-a-real-secret
  DEMO_MODE: "1"

jobs:
  backend:
    name: Database and API
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: jbhifi
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: jbhifi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jbhifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # `pytest` rebuilds jbhifi_test from sql/*.sql on every run and asserts the database name first, so
      # the service database above is never the one a fixture drops.
      - run: pytest -q

  web:
    name: Storefront and admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web

  types:
    name: Generated API types
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: jbhifi
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: jbhifi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jbhifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      # The schema is read from the running API, so a route that is added, renamed or retyped must be
      # accompanied by the regenerated TypeScript types (web/README.md, "After changing the API").
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && break
            sleep 1
          done
          cd web && npm ci && npm run gen:api
          cd .. && git diff --exit-code -- web/src/lib/api/schema.d.ts

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: jbhifi
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: jbhifi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jbhifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The config starts the API with `.venv/bin/python`, which is where `test:e2e` expects it.
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
